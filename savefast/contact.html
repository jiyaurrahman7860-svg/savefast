<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Contact Us - Support & Feedback | SaveFast</title>
  <meta name="description" content="Get in touch with the SaveFast support team. Submit inquiries, reports, and feature requests. We are here to help.">
  <link rel="canonical" href="https://savefast.in/contact.html">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/components.js" defer></script>
</head>
<body>

  <site-header root-path="./"></site-header>

  <main style="padding-top: 120px; padding-bottom: 80px;">
    <div class="container">
      
      <ad-slot data-placement="header"></ad-slot>

      <section class="reveal active text-center" style="margin-bottom: 48px;">
        <h1 class="gradient-text" style="font-size: clamp(32px, 5vw, 48px); margin-bottom: var(--spacing-sm); font-weight: 800;">
          Get in Touch
        </h1>
        <p style="font-size: 16px; color: var(--color-on-surface-variant); max-width: 600px; margin: 0 auto; line-height: 1.6;">
          Have questions, bug reports, or feature ideas? Send us a message and our support team will get back to you shortly.
        </p>
      </section>

      <section class="reveal" style="max-width: 600px; margin: 0 auto;">
        <div class="glass-card p-md" style="border-radius: var(--rounded-lg); border-color: rgba(255,255,255,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
          
          <!-- Success Notification -->
          <div id="contact-success" class="hidden" style="background: rgba(192, 193, 255, 0.1); border: 1px solid var(--color-primary); border-radius: var(--rounded-default); padding: 16px; text-align: center; margin-bottom: 24px;">
            <span class="material-symbols-outlined" style="font-size: 36px; color: var(--color-primary); margin-bottom: 8px;">check_circle</span>
            <h3 style="font-size: 18px; font-weight: 700; color: var(--color-on-surface); margin-bottom: 4px;">Message Sent!</h3>
            <p style="font-size: 14px; color: var(--color-on-surface-variant);">Thank you for contacting us. We will respond as soon as possible.</p>
          </div>

          <!-- Error Notification -->
          <div id="contact-error" class="hidden" style="background: rgba(255, 180, 171, 0.1); border: 1px solid var(--color-error); border-radius: var(--rounded-default); padding: 12px; text-align: center; margin-bottom: 24px; color: var(--color-error); font-weight: 600; font-size: 14px;">
          </div>

          <form id="contact-form" style="display: flex; flex-direction: column; gap: 20px;">
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="contact-name" style="font-size: 13px; font-weight: 600; color: var(--color-on-surface-variant);">Your Name</label>
              <input type="text" id="contact-name" name="name" required placeholder="John Doe">
            </div>

            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="contact-email" style="font-size: 13px; font-weight: 600; color: var(--color-on-surface-variant);">Email Address</label>
              <input type="email" id="contact-email" name="email" required placeholder="john@example.com">
            </div>

            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label for="contact-message" style="font-size: 13px; font-weight: 600; color: var(--color-on-surface-variant);">Message</label>
              <textarea id="contact-message" name="message" required rows="5" placeholder="How can we assist you today?"></textarea>
            </div>

            <button type="submit" id="contact-submit-btn" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: var(--rounded-default); font-weight: 700; font-size: 15px; margin-top: 8px;">
              Send Message
              <span class="material-symbols-outlined" style="font-size: 18px; margin-left: 8px;">send</span>
            </button>
          </form>

        </div>
      </section>

      <ad-slot data-placement="content"></ad-slot>

    </div>
  </main>

  <site-footer root-path="./"></site-footer>

  <!-- Script to capture and store form entries -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('contact-form');
      const submitBtn = document.getElementById('contact-submit-btn');
      const successBox = document.getElementById('contact-success');
      const errorBox = document.getElementById('contact-error');

      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Disable button & reset alerts
        submitBtn.disabled = true;
        submitBtn.innerText = "Sending...";
        errorBox.classList.add('hidden');
        
        const nameVal = document.getElementById('contact-name').value.trim();
        const emailVal = document.getElementById('contact-email').value.trim();
        const messageVal = document.getElementById('contact-message').value.trim();

        if (!nameVal || !emailVal || !messageVal) {
          showFormError("Please fill out all fields.");
          return;
        }

        try {
          const helper = window.firebaseAppInstance;
          if (!helper) {
            throw new Error("Database server is currently connecting. Please try again.");
          }

          const db = helper.db;
          // Store directly in Firestore 'contacts' collection
          await db.collection('contacts').add({
            name: nameVal,
            email: emailVal,
            message: messageVal,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });

          // Show success
          form.classList.add('hidden');
          successBox.classList.remove('hidden');

        } catch (err) {
          console.error("Contact form save failed:", err);
          showFormError(err.message || "Something went wrong while submitting. Please try again.");
        }
      });

      function showFormError(msg) {
        errorBox.innerText = msg;
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `Send Message <span class="material-symbols-outlined" style="font-size: 18px; margin-left: 8px;">send</span>`;
      }
    });

    // Scroll reveal
    const options = { threshold: 0.1 };
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
        }
      });
    }, options);

    document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
  </script>
</body>
</html>
